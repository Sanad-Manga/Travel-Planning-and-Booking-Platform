name: CI

# Runs on every pull request into develop AND on every push to develop (a merge). Same steps as the manual
# review: clean install from the lock file, build, lint, unit tests, e2e tests.
# The push run is the alarm: a merge that breaks develop shows up as a red run on develop within minutes.
# No secrets needed: the tests use an in-memory MongoDB (mongodb-memory-server).
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# A newer push to the same PR cancels the older run. Runs on develop are never cancelled: each merge is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # mongodb-memory-server downloads a ~100 MB mongod binary on first use; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - name: Install (fails if package-lock.json is out of sync)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e
