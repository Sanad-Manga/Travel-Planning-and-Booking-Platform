<script>
  const DATA = {"docs":[{"name":"README","label":"Start here","markdown":"# Architecture of the Travel Planning and Booking Platform\n\n> Verified against `develop` commit `a8e3c80` on 2026-11-27.\n\nThe architecture is documented with the **C4 model**, levels 1 to 3 only (no code level), as Mermaid diagrams in Markdown. GitHub renders them in the browser, and they are reviewed in pull requests like code. A single-page themed viewer ([viewer.html](viewer.html)) shows all of them with a light/dark switch.\n\n## One-minute reading guide\n\n1. **What is this and who uses it?** Read [Level 1: System context](01-system-context.md) (one picture).\n2. **What runs where?** Read [Level 2: Containers](02-containers.md): browser, Next.js on port 3000, NestJS on port 3001, MongoDB, uploads, Stripe, email. The table under it explains the cookie login, the `/api` and `/uploads` proxy and the generated types.\n3. **How does the frontend work and talk to the backend?** Read [Level 3: Frontend components](03-frontend-components.md), section A (the layers) and then [Dynamic flows](05-dynamic-flows.md) a and b.\n4. **What is inside the backend?** Read [Level 3: Backend components](04-backend-components.md).\n5. **Is anything wrong?** Read [FINDINGS](FINDINGS.md). It lists what was inconsistent when the diagrams were checked against the code.\n\n| File | Contents |\n|---|---|\n| [01-system-context.md](01-system-context.md) | Level 1: users, the platform, Stripe, email, exchange rates |\n| [02-containers.md](02-containers.md) | Level 2: containers, protocols, key mechanisms |\n| [03-frontend-components.md](03-frontend-components.md) | Level 3 frontend: layers, routes by role (built and planned), feature modules and owners |\n| [04-backend-components.md](04-backend-components.md) | Level 3 backend: module dependencies, request pipeline, controllers, roles |\n| [05-dynamic-flows.md](05-dynamic-flows.md) | Five interaction flows: login and refresh, paginated list, booking and payment, image upload, server fetch |\n| [06-dev-environment.md](06-dev-environment.md) | Optional: ports, environment variables, CI |\n| [FINDINGS.md](FINDINGS.md) | Problems found while tracing the code, with severity and suggested owner |\n| [viewer.html](viewer.html) | All diagrams on one themed page (open the file in a browser; needs internet for the Mermaid library) |\n\n## Legend\n\nBoxes use the C4 notation (person, system, container, component) with muted colours. The same colours are used in every diagram.\n\n| Look | Meaning |\n|---|---|\n| Sand box | **Person**: a kind of user |\n| Dark teal box, white text | **Our system** (level 1 only) |\n| Light teal box | **Container**: something that runs on its own (frontend, API) or a page area |\n| Light grey box | **Component**: a module, class or shared piece inside a container |\n| Amber cylinder | **Data store**: MongoDB, the upload folder, the Swagger snapshot |\n| Dashed grey box | **External system** we do not own (Stripe, SMTP, FX API), or a **planned** item that is not built yet (it says \"planned\") |\n| Solid arrow | A call or dependency, labelled with what and which protocol |\n| Dotted arrow | An asynchronous or looser link (webhook, \"reads data of\", \"registers with\") |\n\nSequence diagrams (level \"dynamic\") number each step; `alt` blocks show the alternatives.\n\n## Keeping it up to date\n\nDiagrams that nobody updates become wrong. The rule:\n\n> **Update the diagrams in the same pull request** if you change a container, a route, a role guard, a module dependency, a payment or login step, or you merge a planned screen.\n\nSuggested line for the pull request template (not added automatically, because it changes the check everyone uses): `- [ ] Architecture diagrams updated if containers, routes or module dependencies changed (docs/architecture)`.\n\nHow to update:\n\n1. Edit the Mermaid block in the right file. Which one: new route or screen: `03-frontend-components.md` (diagram B, and C for owners); new backend module or `imports`: `04-backend-components.md`; changed login, payment or upload steps: `05-dynamic-flows.md`; new env variable or service: `06-dev-environment.md`.\n2. Re-stamp the line at the top of each file you touched: \"Verified against `develop` commit `\u003csha>` on `\u003cdate>`\" (`git rev-parse --short origin/develop`).\n3. If you found something wrong rather than changed something, add it to `FINDINGS.md` instead of silently drawing around it.\n4. Rebuild the viewer: `node docs/architecture/build-viewer.mjs` (no dependencies; it reads the Markdown files here and writes `viewer.html`). Commit both.\n5. Check that the diagrams render: open the Markdown on GitHub (preview in the pull request) or open `viewer.html`.\n\nTips: keep each diagram to about 25 boxes (split rather than cram); quote labels that contain brackets or slashes (`[\"...\"]`); use `\u003cbr/>` for line breaks; the classDef lines at the bottom of each diagram carry the colours.\n"},{"name":"01-system-context","label":"Level 1: Context","markdown":"# Level 1: System context\n\n> Verified against `develop` commit `a8e3c80` on 2026-11-27. Legend: [README](README.md#legend).\n\n**Question this answers:** who uses the platform, and which outside systems does it depend on?\n\n```mermaid\nflowchart TB\n  guest[\"\u003cb>Guest\u003c/b>\u003cbr/>Not logged in. Searches flights and hotels,\u003cbr/>reads the blog and public itineraries\"]:::person\n  user[\"\u003cb>Traveller (USER)\u003c/b>\u003cbr/>Books flights and hotels, plans itineraries,\u003cbr/>writes blog posts, reviews, favourites\"]:::person\n  air[\"\u003cb>Airline moderator\u003c/b>\u003cbr/>Runs one airline: flights, cabins,\u003cbr/>baggage and cancellation policies\"]:::person\n  hot[\"\u003cb>Hotel moderator\u003c/b>\u003cbr/>Runs one hotel: rooms, availability,\u003cbr/>reservations, review replies\"]:::person\n  adm[\"\u003cb>Admin\u003c/b>\u003cbr/>Accounts, moderators, providers,\u003cbr/>reports, audit log, analytics\"]:::person\n\n  sys[\"\u003cb>Travel Planning and Booking Platform\u003c/b>\u003cbr/>Web app and API for searching, planning\u003cbr/>and paying for trips\"]:::system\n\n  stripe[\"\u003cb>Stripe\u003c/b>\u003cbr/>Card payments and refunds\u003cbr/>(test mode in this project)\"]:::external\n  smtp[\"\u003cb>SMTP server\u003c/b>\u003cbr/>Verification, reset and booking emails.\u003cbr/>In development: an Ethereal test inbox\"]:::external\n  fx[\"\u003cb>FXRatesAPI\u003c/b>\u003cbr/>Daily exchange rates for\u003cbr/>currency display\"]:::external\n\n  guest -->|\"browses (HTTPS)\"| sys\n  user -->|\"uses (HTTPS)\"| sys\n  air -->|\"manages (HTTPS)\"| sys\n  hot -->|\"manages (HTTPS)\"| sys\n  adm -->|\"administers (HTTPS)\"| sys\n\n  sys -->|\"creates payments and refunds (REST)\"| stripe\n  stripe -.->|\"webhook: payment result\"| sys\n  sys -->|\"sends email (SMTP)\"| smtp\n  sys -->|\"fetches latest rates (HTTPS)\"| fx\n\n  classDef person fill:#e7e3d9,stroke:#85807a,color:#22232a\n  classDef system fill:#2d6370,stroke:#224f5a,color:#ffffff\n  classDef external fill:#ece9e1,stroke:#85807a,stroke-dasharray:4 3,color:#5a5b63\n```\n\n## Reading notes\n\n- **Five kinds of visitor.** The backend knows four roles (`USER`, `ADMIN`, `AIRLINE_MODERATOR`, `HOTEL_MODERATOR`, `backend/src/common/enums`). A guest is simply \"no role\": only routes marked `@Public()` answer.\n- **Only the platform talks to Stripe with secrets.** The browser is meant to send card details to Stripe directly (Stripe.js), so card data never reaches our API. The checkout page that does this is planned (ticket M2-51), not built yet.\n- **A booking is confirmed only by Stripe's webhook**, never by the browser telling us the payment worked. See [flow c](05-dynamic-flows.md#c-flight-booking-payment-and-confirmation).\n- **Reference data** (airports, cities, countries, attractions) is loaded into MongoDB once by `npm run seed` from CSV files in `backend/data/`. It is not a live external system.\n- **Currency:** prices and payments use one platform currency (`PLATFORM_CURRENCY`, default USD); FXRatesAPI rates are only for showing converted amounts.\n"},{"name":"02-containers","label":"Level 2: Containers","markdown":"# Level 2: Containers\n\n> Verified against `develop` commit `a8e3c80` on 2026-11-27. Legend: [README](README.md#legend).\n\n**Question this answers:** which deployable pieces make up the platform, and how do they talk to each other?\n\n```mermaid\nflowchart TB\n  person[\"\u003cb>Visitor\u003c/b>\u003cbr/>guest, traveller, moderator, admin\"]:::person\n\n  subgraph FE[\"Frontend: Next.js 16 on port 3000\"]\n    direction TB\n    browser[\"\u003cb>Browser app\u003c/b>\u003cbr/>React 19 client components\u003cbr/>SWR cache, no tokens in JS\"]:::container\n    nextsrv[\"\u003cb>Next.js server\u003c/b>\u003cbr/>Server components (SSR) and\u003cbr/>rewrites /api/* and /uploads/*\"]:::container\n  end\n\n  api[\"\u003cb>NestJS API\u003c/b>\u003cbr/>port 3001, global prefix /api\u003cbr/>Swagger UI at /api/docs\"]:::container\n  mongo[(\"\u003cb>MongoDB Atlas\u003c/b>\u003cbr/>users, flights, hotels, bookings,\u003cbr/>payments, blog, itineraries ...\")]:::store\n  files[(\"\u003cb>Upload store\u003c/b>\u003cbr/>disk folder UPLOAD_STORAGE_ROOT\u003cbr/>staging/ and public/\")]:::store\n\n  stripe[\"\u003cb>Stripe\u003c/b>\"]:::external\n  smtp[\"\u003cb>SMTP / Ethereal\u003c/b>\"]:::external\n  fx[\"\u003cb>FXRatesAPI\u003c/b>\"]:::external\n\n  person -->|\"HTTPS pages\"| browser\n  browser -->|\"same-origin fetch /api/* and /uploads/*\u003cbr/>credentials: include (cookies)\"| nextsrv\n  nextsrv -->|\"rewrite proxy, HTTP\u003cbr/>BACKEND_URL\"| api\n  nextsrv -->|\"server components: serverApi()\u003cbr/>forwards access_token cookie only\"| api\n  api -->|\"Mongoose / MongoDB driver (TLS)\"| mongo\n  api -->|\"read and write image files\"| files\n  api -->|\"PaymentIntents, refunds (Stripe SDK)\"| stripe\n  stripe -.->|\"POST /api/payments/webhook\u003cbr/>signed, raw body\"| api\n  browser -.->|\"card entry via Stripe.js\u003cbr/>PLANNED, ticket M2-51\"| stripe\n  api -->|\"nodemailer, SMTP\"| smtp\n  api -->|\"GET latest rates, scheduled\"| fx\n\n  classDef person fill:#e7e3d9,stroke:#85807a,color:#22232a\n  classDef container fill:#dde8e8,stroke:#2d6370,color:#22232a\n  classDef store fill:#f5ebd6,stroke:#8a5a12,color:#22232a\n  classDef external fill:#ece9e1,stroke:#85807a,stroke-dasharray:4 3,color:#5a5b63\n```\n\n## Key mechanisms\n\n| Mechanism | How it works | Where |\n|---|---|---|\n| **Same-origin proxy** | The browser only ever talks to port 3000. Next.js rewrites `/api/*` and `/uploads/*` to the backend, so cookies are same-origin: no CORS and no cross-site cookie settings. | `frontend/next.config.ts` |\n| **Cookie auth** | Login sets two httpOnly cookies. `access_token` lives 15 minutes (path `/`). `refresh_token` lives 30 minutes sliding and is sent only to `/api/auth/*`. Both are `sameSite: lax`; `secure` follows `COOKIE_SECURE` or `NODE_ENV=production`. JavaScript never sees a token; the user object comes from `GET /api/auth/me`. | `backend/src/auth/auth-cookies.ts` |\n| **Silent refresh** | On a 401, `api()` calls `POST /api/auth/refresh` once (shared by parallel requests, because refresh tokens rotate and are single use), retries once, otherwise redirects to `/login?returnTo=`. | `frontend/src/lib/api.ts`. See [flow a](05-dynamic-flows.md#a-login-cookies-silent-refresh-and-redirect) |\n| **Server rendering with cookies** | A server component calls the backend directly with `BACKEND_URL` and forwards only `access_token`. It never refreshes (it cannot set cookies while rendering); on 401 it renders a client component that refreshes in the browser. | `frontend/src/lib/serverApi.ts`. See [flow e](05-dynamic-flows.md#e-server-component-fetch-with-browser-fallback-on-401) |\n| **Typed API** | Swagger JSON from the API is saved as `frontend/openapi/openapi.json` and turned into `frontend/src/api/schema.d.ts` by `openapi-typescript`. Helpers `ResponseOf`, `QueryOf`, `BodyOf`, `Schema` read it. A backend change then shows up as a TypeScript error. This is a manual step (`npm run gen:api`), so the snapshot can go stale: see [FINDINGS](FINDINGS.md). | `frontend/src/api/` |\n| **Uploads** | A multipart `POST` with a field named `image` (for example `/api/posts/:id/images`, max 5 MB, JPG or PNG) is validated, tracked by an `UploadedFile` record (`pending`, then `ready`) and written to the upload store. The API returns `{ id, url }` with URLs like `/uploads/\u003cid>.png`, which are outside `/api`, hence the second rewrite. Files are served from the store's `public/` folder by ServeStatic, behind a visibility middleware (images of a draft post are only readable by their owner). | `backend/src/uploads/`. See [flow d](05-dynamic-flows.md#d-image-upload-and-display) |\n| **Payments** | The API creates a Stripe PaymentIntent and returns its `clientSecret`. Only the signed webhook `payment_intent.succeeded` confirms a booking. | `backend/src/payments/`. See [flow c](05-dynamic-flows.md#c-flight-booking-payment-and-confirmation) |\n| **Background jobs** | `@nestjs/schedule` crons inside the API: expire overdue holds every minute, flight status every minute, daily maintenance, FX refresh. No separate worker container. | `payments/booking-lifecycle.service.ts`, `flights/flight-status.job.ts`, `fx/fx-rate-refresh.job.ts` |\n\n## What is not here\n\n- No separate database for sessions: access tokens are stateless; refresh and revoked tokens are documents in MongoDB.\n- No CDN, queue, cache server or search engine. Search is MongoDB queries.\n- Card details never reach the API (by design).\n"},{"name":"03-frontend-components","label":"Level 3: Frontend","markdown":"# Level 3: Frontend components\r\n\r\n> Verified against `develop` commit `a8e3c80` on 2026-11-27. Legend: [README](README.md#legend).\r\n\r\n**Question this answers:** what is inside the Next.js frontend, and how do its parts depend on each other?\r\n\r\nThe frontend today is a **solid foundation with almost no screens yet**: the shared building blocks, the typed API layer and the route guards exist and are tested; most pages are `ComingSoon` placeholders waiting for the feature tickets. Solid boxes below exist in the code; **dashed boxes are planned** (tickets in [section C](#c-feature-modules-and-owners)).\r\n\r\n## A. Layers and dependencies\r\n\r\nRead it top to bottom. Diagram A1 shows what wraps and protects a page; diagram A2 shows how any screen reaches the backend through one path that ends in `api()`.\r\n\r\n### A1. Providers, guards and shared components\r\n\r\n```mermaid\r\nflowchart TB\r\n  subgraph LAYOUT[\"app/layout.tsx wraps every page\"]\r\n    direction LR\r\n    cp[\"ConfirmProvider\u003cbr/>useConfirm()\"]:::component --> tp[\"ToastProvider\u003cbr/>useToast()\"]:::component --> ap[\"AuthProvider\u003cbr/>useAuth(): user, login, logout\"]:::component --> sp[\"SWRProvider\u003cbr/>app-wide SWR settings\"]:::component --> shell[\"AppShell\u003cbr/>SkipLink, Header, main, Footer\"]:::component\r\n  end\r\n\r\n  pages[\"\u003cb>Pages\u003c/b> (src/app)\u003cbr/>thin screens: guard, hooks, components\"]:::container\r\n\r\n  subgraph GUARD[\"Route guards (convenience only, the backend enforces)\"]\r\n    direction LR\r\n    rr[\"RequireRole(roles)\u003cbr/>wrong role: friendly message\"]:::component\r\n    ra[\"RequireAuth\u003cbr/>guest to /login?returnTo=\u003cbr/>forced password change\"]:::component\r\n    roles[\"lib/roles\u003cbr/>homePathFor, navLinksFor\"]:::component\r\n    rt[\"lib/returnTo, lib/pendingAction\u003cbr/>safe redirect back after login\"]:::component\r\n  end\r\n\r\n  subgraph SHARED[\"Shared components (src/components)\"]\r\n    direction LR\r\n    tbl[\"DataTable + Pagination\u003cbr/>cards on phones, onRetry,\u003cbr/>empty state\"]:::component\r\n    pick[\"ReferencePicker and\u003cbr/>Airport, City, Country,\u003cbr/>Currency pickers\"]:::component\r\n    img[\"ImageUploader\u003cbr/>JPG/PNG, 5 MB, count,\u003cbr/>upload and remove injected\"]:::component\r\n    form[\"TextField, FormActions,\u003cbr/>ConfirmDialog\"]:::component\r\n    ui[\"Alert, EmptyState, Skeleton, Spinner,\u003cbr/>Card, Steps, Breadcrumbs, PageHeader,\u003cbr/>StatusBadge, Countdown, TierEditor\"]:::component\r\n  end\r\n\r\n  subgraph FMT[\"Formatting and errors (src/lib)\"]\r\n    direction LR\r\n    fm[\"formatMoney (integer cents)\u003cbr/>formatInZone (airport time zone)\"]:::component\r\n    ae[\"toFriendlyError (apiError)\u003cbr/>applyApiErrors (formErrors)\"]:::component\r\n  end\r\n\r\n  LAYOUT --> pages\r\n  pages --> GUARD\r\n  pages --> SHARED\r\n  pages --> FMT\r\n  rr --> ra\r\n  rr --> roles\r\n  ra --> rt\r\n  ra -.->|\"useAuth()\"| ap\r\n\r\n  classDef component fill:#f1efe8,stroke:#85807a,color:#22232a\r\n  classDef container fill:#dde8e8,stroke:#2d6370,color:#22232a\r\n```\r\n\r\n### A2. The typed API layer: how a screen reaches the backend\r\n\r\n```mermaid\r\nflowchart TB\r\n  subgraph UI[\"Who asks for data\"]\r\n    direction LR\r\n    tbl[\"Screen with a list\u003cbr/>(DataTable + Pagination)\"]:::component\r\n    pick[\"Reference pickers\"]:::component\r\n    ap[\"AuthProvider\u003cbr/>/auth/me, login, logout\"]:::component\r\n    img[\"ImageUploader\u003cbr/>caller passes upload() and remove()\"]:::component\r\n    spage[\"Server component page\"]:::component\r\n  end\r\n\r\n  up[\"usePaginated(endpoint, filters)\u003cbr/>page, limit=10, reset on filter change\"]:::component\r\n  rd[\"referenceData.ts\u003cbr/>endpoint functions, fetchAll\"]:::component\r\n  ua[\"useApi(key)\u003cbr/>SWR, the key is the API path\"]:::component\r\n  api[\"\u003cb>api(path, options)\u003c/b>\u003cbr/>fetch with cookies, one shared refresh on 401,\u003cbr/>ApiError with details[], FormData passthrough\"]:::component\r\n  sapi[\"serverApi(path)\u003cbr/>BACKEND_URL plus the access_token cookie\"]:::component\r\n  ty[\"types.ts and schema.d.ts\u003cbr/>ResponseOf, QueryOf, BodyOf, Schema\"]:::component\r\n  oas[(\"openapi/openapi.json\u003cbr/>Swagger snapshot\")]:::store\r\n  proxy[\"Next.js rewrites\u003cbr/>/api/* and /uploads/*\"]:::container\r\n  be[\"NestJS API :3001\"]:::container\r\n\r\n  tbl -.->|\"fed by\"| up\r\n  pick --> rd\r\n  up --> ua\r\n  rd --> ua\r\n  ua --> api\r\n  ap --> api\r\n  img -.-> api\r\n  spage --> sapi\r\n  api -->|\"same-origin /api/*\"| proxy\r\n  proxy --> be\r\n  sapi -->|\"direct HTTP\"| be\r\n  oas -.->|\"npm run gen:api\"| ty\r\n  ty -.->|\"types only\"| rd\r\n\r\n  classDef component fill:#f1efe8,stroke:#85807a,color:#22232a\r\n  classDef container fill:#dde8e8,stroke:#2d6370,color:#22232a\r\n  classDef store fill:#f5ebd6,stroke:#8a5a12,color:#22232a\r\n```\r\n\r\n### What each part is for\r\n\r\n| Part | Why it exists | File |\r\n|---|---|---|\r\n| `api()` | The only way the browser calls the backend. Cookies, one shared refresh on 401 (tokens rotate, so parallel failures must share one refresh), redirect to login, backend error shape `{ statusCode, message, details[] }` as `ApiError`. | `src/lib/api.ts` |\r\n| `useApi` | SWR wrapper. The key is the API path, so every component sharing it shares the cache and `mutate(key)` refreshes all. 4xx answers are not retried. | `src/api/useApi.ts` |\r\n| `usePaginated` | Standard list hook (`?page=&limit=10`), resets to page 1 on new filters, steps back if the last page empties. Returns `items`, `data`, `isLoading`, `error`, `revalidate`. | `src/api/usePaginated.ts` |\r\n| `serverApi` | Server-component fetch with the visitor's `access_token` only; returns `{ ok: false, reason: 'unauthorized' }` on 401 so the page can fall back to a client component. | `src/lib/serverApi.ts` |\r\n| `RequireAuth` / `RequireRole` | Hide a page from guests / the wrong role, and send people with a temporary password to `/change-password`. Nothing protected renders until the check passes. | `src/components/` |\r\n| Types | Generated from the backend's Swagger snapshot, never hand-written. | `src/api/types.ts`, `schema.d.ts` |\r\n\r\n### The standard recipe for a list screen\r\n\r\n`Skeleton` while loading, then `Alert` with Retry on error, then `EmptyState` when empty, then content. `DataTable` has all four built in. See [flow b](05-dynamic-flows.md#b-a-paginated-list-screen).\r\n\r\n## B. Routes by area (built and planned)\r\n\r\nRoute guards and what each page contains **today**. Solid = exists in `src/app`; dashed = planned in the route map of the frontend plan but no file yet.\r\n\r\n```mermaid\r\nflowchart LR\r\n  subgraph PUB[\"Public (no guard)\"]\r\n    direction TB\r\n    login[\"/login\u003cbr/>real LoginForm\"]:::built\r\n    reg[\"/register\u003cbr/>ComingSoon\"]:::stub\r\n    forgot[\"/forgot-password\u003cbr/>ComingSoon\"]:::stub\r\n    flights[\"/flights\u003cbr/>ComingSoon\"]:::stub\r\n    hotels[\"/hotels\u003cbr/>ComingSoon\"]:::stub\r\n    blog[\"/blog\u003cbr/>ComingSoon\"]:::stub\r\n    home[\"/\u003cbr/>home\"]:::built\r\n    pubplan[\"/flights/[id], /hotels/[id],\u003cbr/>/blog/[id], /authors/[id],\u003cbr/>/itineraries/public/...\"]:::planned\r\n  end\r\n\r\n  subgraph ANY[\"RequireAuth (any role)\"]\r\n    direction TB\r\n    acct[\"/account\u003cbr/>ComingSoon\"]:::stub\r\n    chg[\"/change-password\u003cbr/>real form, allowMustChange\"]:::built\r\n    notif[\"/notifications, /favourites\"]:::planned\r\n  end\r\n\r\n  subgraph TRAV[\"RequireRole USER\"]\r\n    direction TB\r\n    book[\"/bookings\u003cbr/>ComingSoon\"]:::stub\r\n    itin[\"/itineraries\u003cbr/>ComingSoon, NO guard yet\"]:::stub\r\n    travplan[\"/checkout/[type]/[id],\u003cbr/>/flights/[id]/book, /hotels/[id]/book,\u003cbr/>/bookings/flights/[id], /itineraries/[id],\u003cbr/>/blog/new, /blog/mine\"]:::planned\r\n  end\r\n\r\n  subgraph AIR[\"RequireRole AIRLINE_MODERATOR\"]\r\n    direction TB\r\n    airp[\"/airline\u003cbr/>ComingSoon\"]:::stub\r\n    airplan[\"/airline/profile, /flights,\u003cbr/>/flights/new, /flights/[id], /policies\"]:::planned\r\n  end\r\n\r\n  subgraph HOT[\"RequireRole HOTEL_MODERATOR\"]\r\n    direction TB\r\n    hotp[\"/hotel\u003cbr/>ComingSoon\"]:::stub\r\n    hotplan[\"/hotel/profile, /rooms, /status,\u003cbr/>/policies, /reservations, /reviews\"]:::planned\r\n  end\r\n\r\n  subgraph ADM[\"RequireRole ADMIN\"]\r\n    direction TB\r\n    admp[\"/admin\u003cbr/>ComingSoon\"]:::stub\r\n    admplan[\"/admin/accounts, /moderators/new,\u003cbr/>/providers, /bookings, /reports,\u003cbr/>/audit-logs, /analytics\"]:::planned\r\n  end\r\n\r\n  subgraph EX[\"Examples (noindex, for developers)\"]\r\n    direction TB\r\n    ex1[\"/examples/theme\u003cbr/>style guide, light and dark\"]:::built\r\n    ex2[\"/examples/server-fetch\u003cbr/>serverApi + client fallback\"]:::built\r\n  end\r\n\r\n  classDef built fill:#dde8e8,stroke:#2d6370,color:#22232a\r\n  classDef stub fill:#f1efe8,stroke:#85807a,color:#22232a\r\n  classDef planned fill:#ffffff,stroke:#85807a,stroke-dasharray:4 3,color:#5a5b63\r\n```\r\n\r\nLegend for this diagram: teal = working screen, grey = placeholder (`ComingSoon`), dashed = planned.\r\n\r\n**Role landing page after login:** USER to `/` (or `returnTo`), AIRLINE_MODERATOR to `/airline`, HOTEL_MODERATOR to `/hotel`, ADMIN to `/admin`, any user with a temporary password to `/change-password` (`src/lib/roles.ts`, `LoginForm.tsx`). The header shows role-specific links (`navLinksFor`); it links only to routes that exist today.\r\n\r\n## C. Feature modules and owners\r\n\r\nThe plan puts each feature in `src/features/\u003cmodule>/` (own `api.ts`, `hooks.ts`, `schemas.ts`, `components/`) with one owner, so pull requests rarely collide. **No `src/features/` folder exists yet**: every module below is planned. Owners and tickets come from `travel-m2-plan/tickets.csv`.\r\n\r\n```mermaid\r\nflowchart TB\r\n  subgraph DONE[\"Foundations (built)\"]\r\n    direction LR\r\n    f1[\"Typed API + hooks\u003cbr/>M2-01 Ziad\"]:::built\r\n    f2[\"RequireRole, role home\u003cbr/>M2-02 Ziad\"]:::built\r\n    f3[\"Pickers M2-03 Ziad\u003cbr/>DataTable, usePaginated M2-04 Walid\u003cbr/>ImageUploader M2-05 Walid\"]:::built\r\n    f4[\"formatMoney, formatInZone,\u003cbr/>StatusBadge, Countdown M2-06 Gabarty\u003cbr/>TierEditor M2-07 Gabarty\"]:::built\r\n    f5[\"serverApi M2-101 Ziad\u003cbr/>/uploads rewrite M2-08 Ahmed\"]:::built\r\n  end\r\n\r\n  subgraph FEAT[\"Feature modules (planned, src/features/...)\"]\r\n    direction TB\r\n    acc[\"account\u003cbr/>register, login, profile, verify, reset,\u003cbr/>notifications, favourites\u003cbr/>Ziad, Walid, Gabarty\"]:::planned\r\n    flt[\"flights\u003cbr/>search, details, booking wizard,\u003cbr/>my bookings, cancel, e-ticket, seats\u003cbr/>Abdu, Abdulrahman H\"]:::planned\r\n    htl[\"hotels\u003cbr/>search, details, rooms, booking,\u003cbr/>reservations, cancel, reviews\u003cbr/>Hessain, Yusuf\"]:::planned\r\n    chk[\"checkout\u003cbr/>policies, Stripe Elements,\u003cbr/>polling, refunds, reports\u003cbr/>Gabarty\"]:::planned\r\n    itn[\"itineraries\u003cbr/>editor, activities, public, clone,\u003cbr/>PDF, linked bookings, budget\u003cbr/>Yassin, Gabarty\"]:::planned\r\n    blg[\"blog\u003cbr/>list, post, likes, comments,\u003cbr/>editor, author page\u003cbr/>Yusuf, Yassin\"]:::planned\r\n    adm[\"admin\u003cbr/>accounts, moderators, providers,\u003cbr/>bookings, reports, audit, analytics\u003cbr/>Walid, Ziad\"]:::planned\r\n    arl[\"airline\u003cbr/>profile, flights, cabins,\u003cbr/>policies, passengers\u003cbr/>Ahmed, Abdulrahman H\"]:::planned\r\n    hmg[\"hotel-manager\u003cbr/>profile, photos, rooms,\u003cbr/>status, policies, reviews\u003cbr/>Hessain, Yusuf, Gabarty\"]:::planned\r\n  end\r\n\r\n  DONE ==>|\"used by every module\"| FEAT\r\n\r\n  %% invisible links lay the nine modules out as a 3 x 3 grid\r\n  acc ~~~ flt ~~~ htl\r\n  chk ~~~ itn ~~~ blg\r\n  adm ~~~ arl ~~~ hmg\r\n  acc ~~~ chk ~~~ adm\r\n  flt ~~~ itn ~~~ arl\r\n  htl ~~~ blg ~~~ hmg\r\n\r\n  classDef built fill:#dde8e8,stroke:#2d6370,color:#22232a\r\n  classDef planned fill:#ffffff,stroke:#85807a,stroke-dasharray:4 3,color:#22232a\r\n```\r\n\r\nTicket ranges per module: account M2-11..19, admin M2-21..28, flights M2-31..38 and M2-85/86, hotels M2-41..49, checkout/shared M2-51..54, itineraries M2-55/56 and M2-61..68, blog M2-71..79, airline M2-81..84, hotel policies M2-87. Cross-cutting: walkthrough M2-91, SEO and accessibility pass M2-98, deployment M2-102..104.\r\n"},{"name":"04-backend-components","label":"Level 3: Backend","markdown":"# Level 3: Backend components\r\n\r\n> Verified against `develop` commit `a8e3c80` on 2026-11-27. Legend: [README](README.md#legend).\r\n\r\n**Question this answers:** what modules make up the NestJS API, which ones depend on which, and how is access controlled?\r\n\r\nThe API is a NestJS modular monolith (`backend/src`): 18 feature modules (17 registered in `app.module.ts`, plus Users via Auth), plus shared code in `common/` and `config/`. It exposes 144 routes across 60 controller classes. Each module has an owner; the working rule is \"never edit another person's module\", so cross-module calls go through exported services or the registry below.\r\n\r\n## A. Module dependencies\r\n\r\nAn arrow `A --> B` means module A imports module B (`imports: [...]` in the Nest module). Dotted arrows are looser couplings that are not a module import. To stay readable the picture is split in two: booking and money first, then content and back office.\r\n\r\n### A1. Booking and money\r\n\r\n```mermaid\r\nflowchart TB\r\n  fl[\"\u003cb>Flights\u003c/b>\u003cbr/>search, flights, cabins, bookings,\u003cbr/>seats, cancel, e-ticket, roster\"]:::component\r\n  ho[\"\u003cb>Hotels\u003c/b>\u003cbr/>search, details, rooms, availability,\u003cbr/>bookings, cancel, reviews, photos\"]:::component\r\n  pay[\"\u003cb>Payments\u003c/b>\u003cbr/>PaymentIntents, webhook, policies,\u003cbr/>BookingLifecycle,\u003cbr/>BookingProviderRegistry\"]:::component\r\n  ref2[\"\u003cb>Refunds\u003c/b>\u003cbr/>issue and track refunds\"]:::component\r\n  notif[\"\u003cb>Notifications\u003c/b>\u003cbr/>in-app list, unread count\"]:::component\r\n  email[\"\u003cb>Email\u003c/b>\u003cbr/>EmailService, SMTP sender\"]:::component\r\n  users[\"\u003cb>Users\u003c/b>\u003cbr/>UsersService, profile,\u003cbr/>upcoming bookings registry\"]:::component\r\n  ref[\"\u003cb>ReferenceData\u003c/b>\u003cbr/>airports, cities, countries,\u003cbr/>currencies\"]:::component\r\n  air[\"\u003cb>Airlines\u003c/b>\u003cbr/>profile, logo, policies\"]:::component\r\n  up[\"\u003cb>Uploads\u003c/b>\u003cbr/>image validate, store, serve\"]:::component\r\n\r\n  fl --> air\r\n  fl --> notif\r\n  fl --> pay\r\n  fl --> ref\r\n  fl --> ref2\r\n  fl --> users\r\n  ho --> notif\r\n  ho --> pay\r\n  ho --> ref\r\n  ho --> ref2\r\n  ho --> up\r\n  ho --> users\r\n  pay --> ref2\r\n  ref2 --> notif\r\n  notif --> email\r\n  notif --> users\r\n  air --> up\r\n  users --> ref\r\n\r\n  fl -.->|\"registers FLIGHT provider\"| pay\r\n  ho -.->|\"registers HOTEL provider\"| pay\r\n\r\n  classDef component fill:#f1efe8,stroke:#85807a,color:#22232a\r\n```\r\n\r\n- **Payments does not import Flights or Hotels.** They register themselves in `BookingProviderRegistry` (`onModuleInit`), so there are no circular module imports and a new bookable thing needs no change in Payments. A booking type with no provider answers a clean 4xx.\r\n- `PaymentsModule` imports `RefundsModule`; `RefundsModule` reuses the Stripe gateway class from the payments folder without importing the module.\r\n\r\n### A2. Content, auth and back office\r\n\r\nThe box \"Platform services\" stands for the shared modules **Users, ReferenceData, Uploads, Email, Notifications and FX**; most modules import two or three of them (the exact imports are in each module's `imports` array).\r\n\r\n```mermaid\r\nflowchart TB\r\n  auth[\"\u003cb>Auth\u003c/b>\u003cbr/>login, refresh, logout, register,\u003cbr/>verify, reset, change password\u003cbr/>global JwtAuthGuard and RolesGuard\"]:::component\r\n  it[\"\u003cb>Itineraries\u003c/b>\u003cbr/>days, activities, budgets, transport costs,\u003cbr/>linked bookings, public, clone, PDF\"]:::component\r\n  bl[\"\u003cb>Blog\u003c/b>\u003cbr/>posts, comments, likes, tags,\u003cbr/>authors, post images\"]:::component\r\n  fav[\"\u003cb>Favourites\u003c/b>\u003cbr/>hotels and itineraries\"]:::component\r\n  rep[\"\u003cb>Reports\u003c/b>\u003cbr/>user reports on content\"]:::component\r\n  adm[\"\u003cb>Admin\u003c/b>\u003cbr/>accounts, moderators, providers,\u003cbr/>moderation, bookings, analytics\"]:::component\r\n  audit[\"\u003cb>Audit\u003c/b>\u003cbr/>admin audit log\"]:::component\r\n  svc[\"\u003cb>Platform services\u003c/b>\u003cbr/>Users, ReferenceData, Uploads,\u003cbr/>Email, Notifications, FX\"]:::component\r\n  ho[\"Hotels (see A1)\"]:::component\r\n  fl[\"Flights (see A1)\"]:::component\r\n  pay[\"Payments (see A1)\"]:::component\r\n  air[\"Airlines (see A1)\"]:::component\r\n\r\n  auth --> svc\r\n  it --> svc\r\n  it --> ho\r\n  it --> air\r\n  it --> pay\r\n  it -.->|\"flight search and cabins readers\"| fl\r\n  bl --> svc\r\n  bl -.->|\"reads Itinerary data\"| it\r\n  fav --> ho\r\n  fav --> it\r\n  rep -.->|\"reads Post, Comment, Itinerary,\u003cbr/>HotelReview data\"| bl\r\n  adm --> svc\r\n  adm --> air\r\n  adm --> audit\r\n  adm --> bl\r\n  adm --> ho\r\n  adm --> it\r\n  adm --> rep\r\n  adm -.->|\"reads flight and hotel bookings, refunds\"| fl\r\n\r\n  classDef component fill:#f1efe8,stroke:#85807a,color:#22232a\r\n```\r\n\r\n- **Admin is the widest module**: it touches eight others, mostly read-only, and writes an audit record for each privileged action through `AuditService`.\r\n- **Cross-module data reads** (dotted arrows) go through `MongooseModule.forFeature` of the other module's schema, not through its service. They do not show up as module imports, so they are the first thing to check when a schema changes.\r\n\r\n## B. How a request is processed\r\n\r\nEvery route goes through the same pipeline, set up in `setup-app.ts` and the global guards in `AuthModule`.\r\n\r\n```mermaid\r\nflowchart TB\r\n  req[\"HTTP request\u003cbr/>from the Next.js proxy\"]:::external --> cookie[\"cookie-parser\u003cbr/>reads access_token\"]:::component\r\n  cookie --> jwt[\"JwtAuthGuard (global)\u003cbr/>@Public() skips it\u003cbr/>verifies JWT, account ACTIVE,\u003cbr/>tokenVersion, mustChangePassword\"]:::component\r\n  jwt --> roles[\"RolesGuard (global)\u003cbr/>no @Roles: any logged-in user\u003cbr/>@Roles(...): role must match, else 403\"]:::component\r\n  roles --> pipe[\"ValidationPipe\u003cbr/>DTO rules, field-level 400\u003cbr/>details: [{ field, message }]\"]:::component\r\n  pipe --> ctrl[\"Controller\u003cbr/>thin: params, DTO, @CurrentUser()\"]:::component\r\n  ctrl --> svc[\"Service\u003cbr/>business rules, ownership check,\u003cbr/>paginate() for lists\"]:::component\r\n  svc --> db[(\"MongoDB\")]:::store\r\n  svc -.->|\"errors\"| filt[\"AllExceptionsFilter\u003cbr/>{ statusCode, error, message,\u003cbr/>details?, path, timestamp }\"]:::component\r\n\r\n  classDef component fill:#f1efe8,stroke:#85807a,color:#22232a\r\n  classDef external fill:#ece9e1,stroke:#85807a,stroke-dasharray:4 3,color:#5a5b63\r\n  classDef store fill:#f5ebd6,stroke:#8a5a12,color:#22232a\r\n```\r\n\r\n- **Ownership is checked in the service, not the controller.** Users only reach their own bookings, itineraries, posts and reviews (404 for someone else's private resource); a moderator editing a different airline or hotel gets 403.\r\n- **`@AllowWhenMustChange()`** lets only `me`, `change-password` and `logout` through for an account with a temporary password.\r\n- **Uploads bypass the guards** (they are served by a raw middleware mounted at `/uploads`) and run their own visibility check that reuses `JwtAuthGuard`.\r\n\r\n## C. Modules, main parts and who may call them\r\n\r\nRoles in the last column are the `@Roles(...)` found on the controllers. \"any login\" means the route has no `@Roles`, so every logged-in role passes. \"public\" means `@Public()`.\r\n\r\n| Module | Main controllers (route prefix) | Main services and parts | Access |\r\n|---|---|---|---|\r\n| Auth | `auth` | `AuthService`, `EmailVerificationService`, `PasswordResetService`, `TokenRevocationService`, cookie helpers, login lockout (5 tries, 15 min) | mostly public (register, login, refresh, logout, forgot/reset, verify); `me`, `change-password`, `resend-verification` any login |\r\n| Users | `users` | `UsersService`, `ProfileService`, `AccountDeactivationService` | `me` GET/PATCH any login; `DELETE me` USER |\r\n| Admin | `admin/accounts`, `admin/moderators`, `admin/providers`, `admin/users`, `admin/content`, `admin/reports`, `admin/bookings`, `admin/analytics` | `AdminService`, `ModeratorAccountsService`, `ProviderStatusService`, `AccountStatusService`, `AdminContentService`, `ReportsAdminService`, `AdminPasswordResetService` | ADMIN (class-level) |\r\n| Audit | `admin/audit-logs` | `AuditService` | ADMIN |\r\n| Airlines | `airlines`, `airlines/:id/logo` | `AirlinesService`, `AirlineLogoService` | `GET :id` public; create ADMIN; edit, policies, logo AIRLINE_MODERATOR |\r\n| Flights | `flights`, `flights/:id/cabins`, `flights/mine`, `flight-bookings` | `FlightsService`, `FlightSearchService`, `FlightBookingsService`, `FlightCabinsService`, `FlightSeatSelectionService`, `FlightCancellationService`, `FlightETicketService`, `FlightBookingProvider`, `FlightStatusJob` | search and `GET :id` public; flight and cabin writes AIRLINE_MODERATOR; all `flight-bookings` USER |\r\n| Hotels | `hotels` (search, details, rooms, availability, reservations, photos, policies), `hotel-bookings`, `reviews` | `HotelsService`, `RoomsService`, `HotelSearchService`, `HotelAvailabilityService`, `HotelBookingsService`, `HotelBookingCancellationService`, `HotelReviewsService`, `HotelPhotosService` | search, details, free rooms, reviews list public; create hotel ADMIN; hotel writes, rooms, photos, reservations, review reply HOTEL_MODERATOR; bookings and own reviews USER |\r\n| Payments | `payments`, `bookings/:type/:id/policies` | `PaymentsService`, `PolicyAcceptanceService`, `BookingLifecycle`, `BookingProviderRegistry`, `StripePaymentGateway`, `RefundCalculator` | USER; `POST payments/webhook` public but signature-verified |\r\n| Refunds | `refunds` | `RefundsService` | USER |\r\n| Itineraries | `itineraries`, `itineraries/public`, `activities`, `budgets`, `transport-costs` | `ItinerariesService`, `ItinerariesPublicService`, `ActivitiesService`, `BudgetsService`, `TransportCostsService`, `ItineraryBookingsService`, `ItineraryPdfService` | public search, detail and PDF for public itineraries; everything else any login (ownership in service) |\r\n| Blog | `posts`, `posts/:id/comments`, `posts/:id/images`, `posts/:id/itinerary`, `comments`, `tags`, `authors` | `BlogService`, `CommentsService`, `PostImagesService`, `AuthorsService`, `PostItineraryService` | list, detail, tags, authors public; rest any login (ownership in service) |\r\n| Favourites | `favourites` | `FavouritesService` | any login |\r\n| Reports | `reports` | `ReportsService`, `ContentLookupService` | any login |\r\n| Notifications | `notifications` | `NotificationsService` | any login |\r\n| ReferenceData | `airports`, `countries`, `cities`, `currencies` | `ReferenceDataService` | public |\r\n| FX | none | `FxService`, `FxRateRefreshJob` | internal |\r\n| Email | none | `EmailService`, `SmtpEmailSender` (real SMTP or an Ethereal test inbox) | internal |\r\n| Uploads | `/uploads/*` (static) | `UploadService`, `UploadStorage`, `UploadRecoveryService`, `UploadVisibilityMiddleware` | public files; draft-post images owner only |\r\n\r\n### Shared code (`common/`, `config/`)\r\n\r\n`common` holds the global guards (`JwtAuthGuard`, `RolesGuard`), decorators (`@Public`, `@Roles`, `@CurrentUser`, `@AllowWhenMustChange`), enums (`Role`, `BookingStatus`, `PaymentStatus`, ...), `paginate()` with the `{ items, page, limit, total, totalPages }` envelope (page size max 50), the validation pipe, the exception filter, money and local-time helpers, and Swagger helpers (`addValidationErrorResponses`). `config` validates the environment at start-up (`env.validation.ts`). The contract every module follows is in `docs/contracts.md`.\r\n"},{"name":"05-dynamic-flows","label":"Dynamic flows","markdown":"# Dynamic diagrams: how the parts interact\r\n\r\n> Verified against `develop` commit `a8e3c80` on 2026-11-27. Legend: [README](README.md#legend).\r\n\r\nThese are C4 \"dynamic\" diagrams: numbered interactions between the containers and components of levels 2 and 3, for the five flows that explain most of the system. Steps marked **(planned)** describe a screen that is not built yet; the backend half of those flows is real.\r\n\r\n1. [Login, cookies, silent refresh and redirect](#a-login-cookies-silent-refresh-and-redirect)\r\n2. [A paginated list screen](#b-a-paginated-list-screen)\r\n3. [Flight booking, payment and confirmation](#c-flight-booking-payment-and-confirmation)\r\n4. [Image upload and display](#d-image-upload-and-display)\r\n5. [Server component fetch with browser fallback on 401](#e-server-component-fetch-with-browser-fallback-on-401)\r\n\r\n## a. Login, cookies, silent refresh and redirect\r\n\r\n**Why it matters:** this is the one mechanism every private screen relies on. Tokens exist only in httpOnly cookies; the page knows who you are only through `GET /api/auth/me`.\r\n\r\n```mermaid\r\n%%{init: {\"sequence\": {\"wrap\": true, \"width\": 150, \"messageMargin\": 32}}}%%\r\nsequenceDiagram\r\n  autonumber\r\n  actor U as Visitor\r\n  participant AP as AuthProvider\r\n  participant A as api()\r\n  participant N as Next.js proxy\r\n  participant B as NestJS API\r\n  participant DB as MongoDB\r\n\r\n  Note over AP,B: Page load: who am I?\r\n  AP->>A: GET /auth/me (redirectOn401: false)\r\n  A->>N: GET /api/auth/me (cookies)\r\n  N->>B: forward\r\n  B-->>A: 401 (no or expired access_token)\r\n  A->>N: POST /api/auth/refresh (once, shared)\r\n  N->>B: forward (refresh_token cookie, path /api/auth only)\r\n  B->>DB: consume refresh token (single use), check account\r\n  B-->>A: 401, cookies cleared\r\n  A-->>AP: guest, user = null\r\n\r\n  Note over U,B: Login\r\n  U->>AP: submit email and password (LoginForm)\r\n  AP->>A: POST /auth/login (retryOn401: false)\r\n  A->>N: POST /api/auth/login\r\n  N->>B: forward\r\n  B->>DB: check password hash, lockout (5 tries, 15 min), status\r\n  B-->>A: 200 user + Set-Cookie access_token (15 min), refresh_token (30 min sliding)\r\n  A-->>AP: user (role, mustChangePassword)\r\n  AP-->>U: redirect: temporary password to /change-password, else returnTo, else the role home\r\n\r\n  Note over U,B: Later: access token expires mid-session\r\n  U->>A: any api() call\r\n  A->>N: request with expired access_token\r\n  N->>B: forward\r\n  B-->>A: 401\r\n  A->>N: POST /api/auth/refresh (parallel failures share this one call)\r\n  N->>B: forward\r\n  B->>DB: rotate refresh token\r\n  B-->>A: 200 + new cookies\r\n  A->>N: retry the original request once\r\n  N->>B: forward\r\n  B-->>A: 200 data\r\n  Note over A,U: If refresh fails: redirect to /login?returnTo=path (no loop on /login)\r\n```\r\n\r\nRole home after login: USER `/`, AIRLINE_MODERATOR `/airline`, HOTEL_MODERATOR `/hotel`, ADMIN `/admin` (`src/lib/roles.ts`).\r\n\r\n## b. A paginated list screen\r\n\r\n**Why it matters:** every list in the app (bookings, accounts, flights, reports) is meant to follow this exact path, so the same four states appear everywhere. Today only the example screen and the tests use it.\r\n\r\n```mermaid\r\n%%{init: {\"sequence\": {\"wrap\": true, \"width\": 150, \"messageMargin\": 32}}}%%\r\nsequenceDiagram\r\n  autonumber\r\n  participant P as Page (guarded)\r\n  participant H as usePaginated\r\n  participant S as useApi / SWR cache\r\n  participant A as api()\r\n  participant N as Next.js proxy\r\n  participant C as Controller\r\n  participant V as Service + paginate()\r\n  participant DB as MongoDB\r\n\r\n  P->>H: usePaginated('/api/admin/accounts', { role: 'USER' })\r\n  H->>S: key = path?filters&page=1&limit=10\r\n  Note over P: isLoading: show Skeleton\r\n  S->>A: fetcher(key)\r\n  A->>N: GET with cookies\r\n  N->>C: forward\r\n  Note over C: JwtAuthGuard, RolesGuard, ValidationPipe on the query DTO\r\n  C->>V: list(query)\r\n  V->>DB: find(filter).sort().skip().limit() and countDocuments(filter)\r\n  DB-->>V: rows, total\r\n  V-->>C: { items, page, limit, total, totalPages }\r\n  C-->>A: 200 JSON\r\n  A-->>S: data cached under the key\r\n  S-->>H: data\r\n  H-->>P: items, page, setPage, error, isLoading\r\n\r\n  alt error\r\n    S-->>P: error (ApiError, 4xx not retried)\r\n    Note over P: Alert with Retry button that calls revalidate()\r\n  else no rows\r\n    Note over P: EmptyState with a next step\r\n  else rows\r\n    Note over P: DataTable plus Pagination\r\n  end\r\n\r\n  P->>H: setPage(2)\r\n  H->>S: key with page=2 (cached pages show instantly)\r\n  Note over H: New filters reset to page 1. If the last page becomes empty after a delete, the hook steps back one page.\r\n```\r\n\r\n## c. Flight booking, payment and confirmation\r\n\r\n**Why it matters:** the riskiest flow. Money is involved, and the booking must never be confirmed by anything except Stripe's signed webhook.\r\n\r\n```mermaid\r\n%%{init: {\"sequence\": {\"wrap\": true, \"width\": 150, \"messageMargin\": 32}}}%%\r\nsequenceDiagram\r\n  autonumber\r\n  actor U as Traveller\r\n  participant F as Frontend (planned screens)\r\n  participant B as NestJS API\r\n  participant DB as MongoDB\r\n  participant S as Stripe\r\n\r\n  U->>F: choose flight, passengers, baggage (wizard, planned M2-34)\r\n  F->>B: POST /api/flight-bookings/hold\r\n  B->>DB: hold seats, booking PENDING_PAYMENT, hold expires in HOLD_MINUTES (10)\r\n  B-->>F: booking with holdExpiresAt\r\n  F->>B: GET /api/bookings/FLIGHT/:id/policies\r\n  B-->>F: cancellation tiers and baggage policy\r\n  U->>F: ticks \"I accept\"\r\n  F->>B: POST /api/bookings/FLIGHT/:id/accept-policies\r\n  F->>B: POST /api/payments (bookingType, bookingId)\r\n  B->>S: create PaymentIntent (amount from the booking, never from the client)\r\n  S-->>B: intent id + clientSecret\r\n  B->>DB: save Payment REQUIRES_PAYMENT\r\n  B-->>F: clientSecret\r\n  F->>S: confirm card with Stripe.js (card data goes only to Stripe) (planned M2-51)\r\n  S-->>F: result shown as \"Payment received, confirming...\"\r\n\r\n  Note over S,B: Asynchronous, signed by Stripe\r\n  S->>B: POST /api/payments/webhook payment_intent.succeeded (raw body + stripe-signature)\r\n  B->>B: verify signature, check amount and currency match the Payment\r\n  B->>DB: BookingLifecycle.confirmPaid: one transaction, status CONFIRMED, booking reference FLT-..., seats booked\r\n  B->>DB: Payment SUCCEEDED, in-app notification BOOKING_CONFIRMED\r\n\r\n  loop about every 2 s, up to about 60 s (planned M2-52)\r\n    F->>B: GET /api/flight-bookings/:id\r\n    B-->>F: PENDING_PAYMENT until the webhook has run, then CONFIRMED\r\n  end\r\n  F-->>U: confirmation page, e-ticket (GET /api/flight-bookings/:id/e-ticket)\r\n\r\n  Note over B,DB: Failure paths\r\n  Note over B: payment_failed or canceled: Payment FAILED/CANCELLED, POST /api/payments/:id/retry allowed while the hold is alive\r\n  Note over B: Hold passes without payment: the every-minute sweep (and any read) turns the booking EXPIRED and returns the seats\r\n```\r\n\r\nHotel bookings follow the same payment path through `POST /api/hotel-bookings` and `bookings/HOTEL/...`; both register as providers in `BookingProviderRegistry`. For local demos the webhook only arrives if `stripe listen --forward-to localhost:3001/api/payments/webhook` is running ([dev-setup](../dev-setup.md)).\r\n\r\n## d. Image upload and display\r\n\r\n**Why it matters:** images are the one place the browser sends multipart data, and the returned URLs live outside `/api`.\r\n\r\n```mermaid\r\n%%{init: {\"sequence\": {\"wrap\": true, \"width\": 150, \"messageMargin\": 32}}}%%\r\nsequenceDiagram\r\n  autonumber\r\n  actor U as User\r\n  participant IU as ImageUploader\r\n  participant Fn as upload() from the caller\r\n  participant A as api()\r\n  participant N as Next.js proxy\r\n  participant B as Controller + UploadService\r\n  participant DB as MongoDB\r\n  participant FS as Upload store (disk)\r\n  participant M as Visibility middleware\r\n\r\n  U->>IU: choose a file\r\n  Note over IU: checks JPG/PNG, 5 MB, max count before sending\r\n  IU->>Fn: upload(file)\r\n  Fn->>A: POST /posts/:id/images with FormData field \"image\"\r\n  A->>N: multipart (no JSON content type)\r\n  N->>B: forward\r\n  Note over B: JwtAuthGuard, ownership check, FileInterceptor limit 5 MB\r\n  B->>B: validate it is a real JPG or PNG\r\n  B->>DB: UploadedFile record, state pending (unique slot per owner)\r\n  B->>FS: write file\r\n  B->>DB: state ready\r\n  B-->>A: 201 { id, url: \"/uploads/id.png\" }\r\n  A-->>IU: ImageReference, preview shown\r\n\r\n  Note over U,FS: Display\r\n  U->>N: browser requests GET /uploads/id.png (img tag)\r\n  N->>M: rewrite /uploads/* to the backend (no /api prefix)\r\n  M->>DB: who may see this file? draft-post images: owner only\r\n  M->>FS: ServeStatic reads public/id.png\r\n  FS-->>U: image bytes\r\n\r\n  Note over IU,A: Remove: confirm dialog, then DELETE /posts/:id/images/:imageId, then the file is deleted too\r\n```\r\n\r\nThe uploader itself never calls the API: each screen passes `upload()` and `remove()` that call the right endpoint (blog post images, hotel photos, airline logo, activity images). A wrapper for those endpoints does not exist yet; see [FINDINGS](FINDINGS.md).\r\n\r\n## e. Server component fetch with browser fallback on 401\r\n\r\n**Why it matters:** six private pages are planned to render on the server (booking details, itinerary detail, role dashboards). Refresh tokens rotate, and a server component cannot set cookies while rendering, so it must never refresh by itself.\r\n\r\n```mermaid\r\n%%{init: {\"sequence\": {\"wrap\": true, \"width\": 150, \"messageMargin\": 32}}}%%\r\nsequenceDiagram\r\n  autonumber\r\n  actor U as Visitor\r\n  participant NS as Next.js server (page.tsx)\r\n  participant SA as serverApi()\r\n  participant B as NestJS API\r\n  participant CC as Client fallback component\r\n  participant A as api() in the browser\r\n\r\n  U->>NS: request a private page (cookies sent to port 3000)\r\n  NS->>SA: serverApi('/api/auth/me')\r\n  SA->>SA: read access_token with cookies(), the refresh token is never forwarded\r\n  SA->>B: GET BACKEND_URL/api/auth/me (Cookie: access_token, no-store)\r\n  alt 200\r\n    B-->>SA: data\r\n    SA-->>NS: { ok: true, data }\r\n    NS-->>U: HTML already contains the data\r\n  else 401 (guest or access token expired)\r\n    B-->>SA: 401\r\n    SA-->>NS: { ok: false, reason: 'unauthorized' }\r\n    NS-->>U: HTML with the client fallback component\r\n    U->>CC: hydrates in the browser\r\n    CC->>A: useApi('/api/auth/me')\r\n    A->>B: through the proxy, on 401 one refresh and one retry\r\n    A-->>CC: data, or redirect to /login?returnTo=\r\n  else other error\r\n    B-->>SA: 4xx or 5xx\r\n    SA-->>NS: throws ApiError, shown by the nearest error boundary\r\n  end\r\n```\r\n\r\nThe working example is `src/app/examples/server-fetch/`. Copy its shape for real pages.\r\n"},{"name":"06-dev-environment","label":"Dev environment","markdown":"# Optional: development environment\n\n> Verified against `develop` commit `a8e3c80` on 2026-11-27. Legend: [README](README.md#legend). Setup steps themselves are in [docs/dev-setup.md](../dev-setup.md); this page only shows how the pieces connect.\n\n```mermaid\nflowchart LR\n  dev[\"\u003cb>Developer machine\u003c/b>\"]:::person\n\n  subgraph LOCAL[\"Local processes\"]\n    direction TB\n    fe[\"\u003cb>Next.js\u003c/b> npm run dev\u003cbr/>http://localhost:3000\u003cbr/>.env.local: BACKEND_URL,\u003cbr/>NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY\"]:::container\n    be[\"\u003cb>NestJS\u003c/b> npm run start:dev\u003cbr/>http://localhost:3001/api\u003cbr/>Swagger /api/docs, /api/docs-json\u003cbr/>.env: see table\"]:::container\n    cli[\"\u003cb>Stripe CLI\u003c/b> stripe listen\u003cbr/>forwards webhooks to\u003cbr/>localhost:3001/api/payments/webhook\"]:::container\n    disk[(\"uploads/ folder\u003cbr/>(UPLOAD_STORAGE_ROOT)\")]:::store\n  end\n\n  mongo[(\"\u003cb>MongoDB Atlas\u003c/b>\u003cbr/>team database\u003cbr/>MONGODB_URI, your IP allow-listed\")]:::store\n  stripe[\"Stripe (test mode)\"]:::external\n  eth[\"Ethereal test inbox\u003cbr/>(when SMTP_HOST is empty)\"]:::external\n  fxapi[\"FXRatesAPI\"]:::external\n\n  dev -->|\"browser\"| fe\n  fe -->|\"/api/* and /uploads/*\"| be\n  be --> mongo\n  be --> disk\n  be --> stripe\n  stripe -.-> cli\n  cli -.->|\"signed webhook\"| be\n  be -->|\"preview link printed in the log\"| eth\n  be --> fxapi\n\n  classDef person fill:#e7e3d9,stroke:#85807a,color:#22232a\n  classDef container fill:#dde8e8,stroke:#2d6370,color:#22232a\n  classDef store fill:#f5ebd6,stroke:#8a5a12,color:#22232a\n  classDef external fill:#ece9e1,stroke:#85807a,stroke-dasharray:4 3,color:#5a5b63\n```\n\n## Environment variables that change behaviour\n\n| Variable | Where | Effect |\n|---|---|---|\n| `BACKEND_URL` | frontend | Where Next.js proxies `/api/*` and `/uploads/*` and where server components call. Default `http://localhost:3001`. |\n| `NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY` | frontend | Public test key for Stripe.js (checkout, planned). Never a secret key: `NEXT_PUBLIC_*` goes to every browser. |\n| `PORT`, `FRONTEND_URL` | backend | API port (3001) and the one allowed CORS origin (3000). |\n| `MONGODB_URI`, `JWT_ACCESS_SECRET`, `JWT_REFRESH_SECRET` | backend | Required; validated at start-up. |\n| `COOKIE_SECURE` | backend | `false` for local http; defaults to true when `NODE_ENV=production`. Wrong value means login cookies are not stored. |\n| `STRIPE_SECRET_KEY`, `STRIPE_WEBHOOK_SECRET` | backend | Payments. The webhook secret is the `whsec_...` that `stripe listen` prints. |\n| `HOLD_MINUTES`, `PLATFORM_CURRENCY` | backend | Booking hold length (default 10) and the single platform currency (default USD). |\n| `SMTP_*` | backend | Empty means an Ethereal test inbox; the preview URL of each email is logged. |\n| `AUTO_VERIFY_EMAIL` | backend | Dev/demo only. Exactly `true` verifies new accounts without an email. |\n| `UPLOAD_STORAGE_ROOT` | backend | Folder for uploaded images (default `./uploads`). A temporary disk on a host loses images on restart. |\n| `FX_API_KEY` | backend | Optional key for FXRatesAPI. |\n| `ADMIN_SEED_*` | backend | Used only by `npm run seed:admin`. |\n\n## Automation around the code\n\n- **Pre-push hook** (`.githooks/pre-push`): builds and lints the backend before a push.\n- **CI** (`.github/workflows/ci.yml`): on every pull request into `develop` and every push to `develop`: backend build, lint, unit and e2e tests (in-memory MongoDB, no secrets) and the frontend lint, typecheck, test, build. A pull request that only touches `frontend/`, `docs/`, Markdown or `AI_PROMPTS.txt` skips the long backend run.\n- **PR checklist** (`.github/workflows/pr-checklist.yml`): fails while any `- [ ]` box in the pull request description is unticked.\n"},{"name":"FINDINGS","label":"Findings","markdown":"# Architecture findings\n\n> Verified against `develop` commit `a8e3c80` on 2026-11-27. Nothing here has been fixed: this is a report for the team and Ahmed to triage.\n\n**Method.** The diagrams were drawn from the code (module `imports`, controllers and `@Roles`, `next.config.ts`, `src/lib`, `src/api`, `src/components`, `src/app`), then compared with the plan in `travel-m2-plan/` (`02-architecture.md`, `tickets.csv`) and `docs/contracts.md`. Where docs and code disagree, the code wins and the disagreement is listed here. The backend route list was extracted from the controller decorators and compared with `frontend/openapi/openapi.json` by script (144 routes in code, 141 in the snapshot).\n\n**Severity** is a guess: **High** = a user-visible bug or a security or data risk; **Medium** = will cause rework or a wrong result if not handled; **Low** = tidy-up or documentation; **Info** = status, no action needed.\n\n## Summary\n\n| ID | Severity | What | Suggested owner |\n|---|---|---|---|\n| [F-01](#f-01) | Medium | Swagger snapshot and generated types are missing two merged endpoints | Walid and Ahmed (then Ziad for a guard) |\n| [F-02](#f-02) | Medium | Backend routes without `@Roles` let admins and moderators use traveller features | Module owners, decision by Ahmed |\n| [F-03](#f-03) | Medium | No error, not-found or loading screens in the app | Ziad |\n| [F-04](#f-04) | Medium | Backend endpoint for changing a flight booking has no frontend ticket | Ahmed (planning), Abdulrahman H |\n| [F-05](#f-05) | Medium | Frontend has two real screens; every feature module is still unbuilt | Ahmed (planning) |\n| [F-06](#f-06) | Low | Plan document `02-architecture.md` no longer matches the code | Ahmed |\n| [F-07](#f-07) | Low | `/itineraries` placeholder has no guard; `/account` is open to roles that cannot deactivate | Yassin, Ziad |\n| [F-08](#f-08) | Low | Four upload endpoints, no shared wrapper for `ImageUploader` | Walid |\n| [F-09](#f-09) | Low | Stripe.js packages are not installed yet | Gabarty |\n| [F-10](#f-10) | Low | `access_token` cookie name is duplicated in the frontend | Ziad |\n| [F-11](#f-11) | Low | Swagger title still says \"Milestone 1\" | Backend owner of `setup-app.ts` |\n| [F-12](#f-12) | Low | Developer example pages are routable in production builds | Ahmed |\n| [F-13](#f-13) | Low | CORS is enabled although the browser never calls the API cross-origin | Ahmed |\n| [F-14](#f-14) | Info | Tickets M2-09 and M2-10 are done in the backend | Ahmed (tracker) |\n\nFrontend calls with no backend route: **none** (see [checked and consistent](#checked-and-consistent)).\n\n---\n\n\u003ca id=\"f-01\">\u003c/a>\n## F-01 (Medium) Swagger snapshot is stale\n\n- **What:** `frontend/openapi/openapi.json` and the generated `frontend/src/api/schema.d.ts` do not contain `GET /api/admin/providers` (ACC-15, merged in #208) or `GET /api/flights/mine` (FLT-29, merged in #204). Both exist in the backend. Until the snapshot is regenerated, `ResponseOf\u003c'/api/admin/providers'>` does not compile, so the Providers page (M2-23) and My flights (M2-85) cannot use typed calls. (`POST /api/payments/webhook` is also missing, on purpose: it is excluded from Swagger.)\n- **Where:** `frontend/openapi/openapi.json`, `frontend/src/api/schema.d.ts`, `backend/src/admin/provider-list.controller.ts`, `backend/src/flights/my-flights.controller.ts`.\n- **Why it keeps happening:** regeneration is manual (`npm run gen:api`), and a backend pull request does not touch the frontend files.\n- **Suggested fix (not done):** regenerate and commit both files; then consider a CI step or checklist line \"backend routes changed: regenerate the frontend API types\".\n- **Owner:** Walid and Ahmed for the immediate regeneration (they need the two endpoints); Ziad owns the generation convention.\n\n\u003ca id=\"f-02\">\u003c/a>\n## F-02 (Medium) Roles: routes with no `@Roles` are open to every logged-in role\n\n- **What:** `RolesGuard` lets a route through when it has no `@Roles`. These controllers have none, so an ADMIN, AIRLINE_MODERATOR or HOTEL_MODERATOR passes the role check and gets 2xx: creating and editing itineraries (`itineraries`, `activities`, `budgets`, `transport-costs`), writing blog posts, comments and likes (`posts`, `comments`), `favourites`, `reports`, `notifications`. The frontend plan treats these as traveller screens (a moderator \"sees a friendly this page is for travellers message\"), and the hotel and flight booking routes are `@Roles(Role.USER)`, so the rules are not consistent across modules.\n- **Where:** `backend/src/itineraries/*.controller.ts`, `backend/src/blog/blog.controller.ts`, `comments.controller.ts`, `comment-item.controller.ts`, `post-images.controller.ts`, `post-itinerary.controller.ts`, `backend/src/favourites/favourites.controller.ts`, `backend/src/reports/reports.controller.ts`. `docs/contracts.md` says ownership is checked in the service, which holds, but it does not say which roles may use these features.\n- **Decision needed:** is it intended that moderators and admins can blog and plan itineraries? If travellers only, add `@Roles(Role.USER)` (and the matching `RequireRole` on the pages). If everyone may, the frontend guards for those pages must be `RequireAuth`, not `RequireRole USER`, and the plan text should say so. Reports and notifications are plausibly for everyone.\n- **Owner:** the module owners (Yassin itineraries, Yusuf blog, Gabarty reports and favourites per the tickets); decision by Ahmed.\n\n\u003ca id=\"f-03\">\u003c/a>\n## F-03 (Medium) No error, not-found or loading screens\n\n- **What:** there is no `error.tsx`, `not-found.tsx`, `loading.tsx` or `global-error.tsx` anywhere under `frontend/src/app`. `serverApi` throws `ApiError` for non-401 failures and its comment says \"shown by the nearest error.tsx / error boundary\", but none exists, so a failing server-rendered page shows Next's generic error page. The plan also lists friendly `ErrorPage` / `NotFound` helpers (ACC-11, rejected private access) and none exists.\n- **Where:** `frontend/src/app/`, `frontend/src/lib/serverApi.ts`.\n- **Owner:** Ziad (shell and foundations). Needed before the server-rendered pages (booking details, itinerary detail, role dashboards).\n\n\u003ca id=\"f-04\">\u003c/a>\n## F-04 (Medium) Backend feature without a frontend ticket\n\n- **What:** `PATCH /api/flight-bookings/:id/change-flight` (FLT-27, equal-fare change, one-way only) is implemented and tested in the backend. No ticket in `tickets.csv` covers a screen for it (M2-34..38 cover the wizard, list, cancel, e-ticket and seat selection). Either it is intentionally out of Milestone 2 scope, or a ticket is missing.\n- **Where:** `backend/src/flights/flight-bookings.controller.ts` (line of `change-flight`), `travel-m2-plan/tickets.csv`.\n- **Owner:** Ahmed to decide scope; Abdulrahman H if it is added.\n\n\u003ca id=\"f-05\">\u003c/a>\n## F-05 (Medium) Frontend is foundations only\n\n- **What (status, not a defect):** the built frontend is the shell, the theme, auth screens (`/login`, `/change-password`), the shared components and the typed API layer. Eleven routes are `ComingSoon` placeholders (`/register`, `/forgot-password`, `/flights`, `/hotels`, `/blog`, `/itineraries`, `/bookings`, `/account`, `/admin`, `/airline`, `/hotel`). There is no `src/features/` folder. The frontend currently calls only `/auth/me`, `/auth/login`, `/auth/logout`, `/auth/change-password` and the four reference lookups (`airports`, `countries`, `cities`, `currencies`). The rest of the 144 backend routes have no frontend caller yet.\n- **Risk:** about 60 feature tickets (Sprints S1 and S2) all depend on the same foundations being merged; the diagrams mark every planned screen so progress can be read off them.\n- **Owner:** Ahmed (planning and tracking). Update the [frontend diagram](03-frontend-components.md) when a feature merges.\n\n\u003ca id=\"f-06\">\u003c/a>\n## F-06 (Low) Plan document is out of date\n\nWhere `travel-m2-plan/02-architecture.md` and the code disagree (code wins):\n\n| Plan says | Code has |\n|---|---|\n| \"no role-based route guard yet\" | `RequireRole`, `lib/roles.ts` exist (M2-02) |\n| Generated types at `types/api.d.ts` | `src/api/schema.d.ts`, helpers in `src/api/types.ts` |\n| `lib/server.ts` for public server fetch | only `lib/serverApi.ts` (forwarded cookies, 401 signal); public pages can reuse it, since it sends no cookie when none exists |\n| Route groups `(auth)`, `(traveller)`, `(public)`, and `airline/layout.tsx` with `RequireRole` | flat folders; each page wraps itself in `RequireRole`; no layout files per area |\n| Wrong-role visitor \"is redirected to their own home\" | `RequireRole` shows an error alert with a \"Go to your home\" link |\n| `NotificationBell`, `ReportDialog`, `BookingStatusActions`, `formatDateRange`, `ErrorPage` as shared blocks | none exist yet (planned tickets M2-17, M2-54, others) |\n\n- **Owner:** Ahmed. Low risk, but new people read that document first.\n\n\u003ca id=\"f-07\">\u003c/a>\n## F-07 (Low) Guards on placeholder pages\n\n- `/itineraries` is a placeholder with no `RequireAuth` or `RequireRole`, but every `itineraries` API call needs a login. Fine while it is a placeholder; the real page (M2-61) must add a guard.\n- `/account` uses `RequireAuth` (any role), but `DELETE /api/users/me` is `@Roles(Role.USER)`. When M2-15 adds \"Deactivate my account\", moderators and admins must not see a button that will answer 403.\n- **Where:** `frontend/src/app/itineraries/page.tsx`, `frontend/src/app/account/page.tsx`, `backend/src/users/users.controller.ts`.\n- **Owner:** Yassin (itineraries), Ziad (account).\n\n\u003ca id=\"f-08\">\u003c/a>\n## F-08 (Low) Uploads: four endpoints, no shared wrapper\n\n- **What:** `ImageUploader` expects each screen to pass `upload()` and `remove()`. The backend has four upload endpoints, all with the multipart field named `image` (consistent): `posts/:id/images`, `hotels/:id/photos`, `airlines/:id/logo`, `activities/:id/images`. No endpoint function or hook wraps them, so four screens may write four versions of the same `FormData` call.\n- **Where:** `frontend/src/components/ImageUploader.tsx`, `frontend/src/api/`.\n- **Suggested fix (not done):** one `uploadImage(endpoint, file)` and `removeImage(endpoint)` pair beside `referenceData.ts`.\n- **Owner:** Walid (uploader author).\n\n\u003ca id=\"f-09\">\u003c/a>\n## F-09 (Low) Stripe.js is not installed\n\n- **What:** the plan (and `.env.example`) expects `@stripe/stripe-js` and `@stripe/react-stripe-js` for Stripe Elements; neither is in `frontend/package.json`. `NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY` is documented but unused. This is expected until M2-51, but it is the one frontend dependency the riskiest screen needs, and installing it needs network access and a lockfile update.\n- **Where:** `frontend/package.json`, `frontend/.env.example`.\n- **Owner:** Gabarty (M2-51).\n\n\u003ca id=\"f-10\">\u003c/a>\n## F-10 (Low) Cookie name duplicated\n\n- **What:** `serverApi.ts` hard-codes `'access_token'`; the backend defines it once in `ACCESS_TOKEN_COOKIE` (`backend/src/common/constants.ts`). They match today. If the backend name ever changes, server-rendered private pages silently fall into the 401 fallback.\n- **Where:** `frontend/src/lib/serverApi.ts`, `backend/src/common/constants.ts`.\n- **Owner:** Ziad. A comment pointing at the backend constant is enough.\n\n\u003ca id=\"f-11\">\u003c/a>\n## F-11 (Low) Swagger text is out of date\n\n- **What:** the Swagger description says \"GIU Software Project I - Milestone 1 backend\", while the API now covers the whole platform.\n- **Where:** `backend/src/setup-app.ts` (`buildSwaggerDocument`).\n- **Owner:** whoever owns `setup-app.ts`. Cosmetic, but the same document feeds the frontend types.\n\n\u003ca id=\"f-12\">\u003c/a>\n## F-12 (Low) Example pages ship in production builds\n\n- **What:** `/examples/theme` and `/examples/server-fetch` are normal routes (marked `noindex`) and are served by `next start` as well as `next dev`. Harmless, but visitors can reach them, and `/examples/theme` renders all shared components.\n- **Where:** `frontend/src/app/examples/`.\n- **Decision needed:** keep them as living documentation, or hide them outside development (for the deployment ticket M2-102/103).\n- **Owner:** Ahmed.\n\n\u003ca id=\"f-13\">\u003c/a>\n## F-13 (Low) CORS is enabled but not needed\n\n- **What:** the API calls `enableCors({ origin: FRONTEND_URL, credentials: true })`. The browser only talks to port 3000 and Next.js proxies `/api/*`, and server components call the API server-to-server, so cross-origin requests never happen in the intended setup. It is harmless, but a wrong `FRONTEND_URL` would suggest a problem that does not exist, and it leaves a credentialed cross-origin door open for one origin.\n- **Where:** `backend/src/setup-app.ts`.\n- **Owner:** Ahmed (decide to keep for Swagger and tooling, or remove).\n\n\u003ca id=\"f-14\">\u003c/a>\n## F-14 (Info) Backend tickets already delivered\n\n- M2-09 (providers list for admin) is `GET /api/admin/providers` (merged #208) and M2-10 (my airline's flights) is `GET /api/flights/mine` (merged #204). The frontend tickets that depend on them (M2-23, M2-85) are unblocked once F-01 is fixed.\n- **Owner:** Ahmed (tracker).\n\n---\n\n## Checked and consistent\n\nThese were checked in the code and found fine; listed so nobody repeats the work.\n\n- **Every frontend API call has a backend route:** `/auth/me`, `/auth/login`, `/auth/logout`, `/auth/change-password`, `/airports`, `/countries`, `/cities`, `/currencies`, and `/auth/refresh` (inside `api()`). All exist with the same methods.\n- **Role names match:** `USER`, `ADMIN`, `AIRLINE_MODERATOR`, `HOTEL_MODERATOR` are identical in `frontend/src/lib/roles.ts` and `backend/src/common/enums`.\n- **Frontend guards agree with the backend** where both exist: `/admin` is ADMIN (`admin/*` controllers are `@Roles(ADMIN)`), `/airline` is AIRLINE_MODERATOR, `/hotel` is HOTEL_MODERATOR, `/bookings` is USER (`flight-bookings` and `hotel-bookings` are USER).\n- **Cookie and proxy mechanics:** `access_token` (path `/`, 15 min) and `refresh_token` (path `/api/auth`, 30 min sliding) are both httpOnly and `sameSite: lax`; the refresh path survives the Next.js rewrite because the proxied path stays `/api/auth/refresh`.\n- **`/uploads` rewrite** exists in `next.config.ts` next to the `/api` rewrite (M2-08), matching the backend's static serving outside the global prefix.\n- **Upload field name** is `image` on all four upload endpoints, and the limit (5 MB, JPG/PNG) is the same in `ImageUploader` and the backend.\n- **Route order inside modules** does not shadow static routes: `flights/search` and `flights/mine` are registered before `flights/:id`, `hotels/search` before `hotels/:id`, `posts/mine` before `posts/:id`.\n- **The payment confirmation rule** holds in code: only the signature-verified webhook (`payments.service.ts`, `onSucceeded`) confirms a booking, and it compares amount and currency first.\n- **Test doubles stay out of production:** `FakeStripeGateway`, `FakeBookingProvider` and `FakeEmailSender` exist in `src`, but production modules bind `StripePaymentGateway` and `SmtpEmailSender` (the no-op sender is chosen only when `NODE_ENV=test`).\n- **Cross-module imports** form no cycle: Payments never imports Flights or Hotels; they register in `BookingProviderRegistry`.\n"}],"meta":{"sha":"a8e3c80","date":"2026-11-27"}};
  const root = document.documentElement;
  const GITHUB = 'https://github.com/Sanad-Manga/Travel-Planning-and-Booking-Platform/blob/develop/docs/';
  const sources = [];            // mermaid source per diagram index
  window.__diagramErrors = [];

  document.getElementById('sha').textContent = DATA.meta.sha;
  document.getElementById('date').textContent = DATA.meta.date;

  /* ---------- Markdown to HTML ---------- */
  const slug = (text) => text.toLowerCase().trim().replace(/[^\w\- ]+/g, '').replace(/ /g, '-');
  const escapeHtml = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const names = DATA.docs.map((d) => d.name);
  let currentDoc = '';

  function mapHref(href) {
    if (!href) return href;
    if (/^https?:/.test(href)) return href;
    if (href.startsWith('#')) return '#' + currentDoc + '--' + href.slice(1);
    const m = /^([^#]+)\.md(?:#(.*))?$/.exec(href);
    if (m && names.includes(m[1])) return m[2] ? '#' + m[1] + '--' + m[2] : '#doc-' + m[1];
    if (href.startsWith('../')) return GITHUB + href.slice(3);
    return href;
  }

  const renderer = new marked.Renderer();
  renderer.heading = (text, level, raw) => `<h${level} id="${currentDoc}--${slug(raw)}">${text}</h${level}>`;
  renderer.link = (href, title, text) => {
    const target = mapHref(href);
    const external = /^https?:/.test(target);
    return `<a href="${target}"${external ? ' target="_blank" rel="noopener"' : ''}>${text}</a>`;
  };
  renderer.table = (header, body) => `<div class="tablewrap"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`;
  renderer.code = (code, info) => {
    if ((info || '').trim() === 'mermaid') {
      const i = sources.push(code) - 1;
      return `<figure class="diagram"><div class="bar"><button type="button" data-expand>Expand</button></div><div class="diagram-body" data-i="${i}"><div class="pending">Drawing diagram...</div></div></figure>`;
    }
    return `<pre><code>${escapeHtml(code)}</code></pre>`;
  };
  marked.setOptions({ renderer, gfm: true, mangle: false, headerIds: false });

  const rail = document.getElementById('rail');
  const content = document.getElementById('content');
  for (const doc of DATA.docs) {
    currentDoc = doc.name;
    const md = doc.markdown.replace(/<a id="([^"]+)"><\/a>/g, `<a id="${doc.name}--$1"></a>`);
    const section = document.createElement('section');
    section.className = 'doc';
    section.id = 'doc-' + doc.name;
    section.innerHTML = marked.parse(md);
    content.appendChild(section);
    const link = document.createElement('a');
    link.href = '#doc-' + doc.name;
    link.textContent = doc.label;
    link.dataset.doc = doc.name;
    rail.appendChild(link);
  }

  /* Severity badges in the findings tables and headings */
  document.querySelectorAll('td').forEach((td) => {
    const t = td.textContent.trim();
    if (/^(High|Medium|Low|Info)$/.test(t)) td.innerHTML = `<span class="sev sev-${t.toLowerCase()}">${t}</span>`;
  });
  document.querySelectorAll('#doc-FINDINGS h2').forEach((h) => {
    h.innerHTML = h.innerHTML.replace(/\((High|Medium|Low|Info)\)/, (m, s) => `<span class="sev sev-${s.toLowerCase()}">${s}</span>`);
  });

  /* ---------- Theme ---------- */
  const THEMES = {
    light: {
      background: '#fcfbf8', primaryColor: '#f1efe8', primaryTextColor: '#22232a', primaryBorderColor: '#85807a',
      lineColor: '#85807a', textColor: '#22232a', edgeLabelBackground: '#fcfbf8',
      clusterBkg: '#f5f3ee', clusterBorder: '#dfdbd0', secondaryColor: '#ece9e1', tertiaryColor: '#f5f3ee',
      actorBkg: '#dde8e8', actorBorder: '#2d6370', actorTextColor: '#22232a', actorLineColor: '#85807a',
      signalColor: '#5a5b63', signalTextColor: '#22232a', labelBoxBkgColor: '#ece9e1', labelBoxBorderColor: '#85807a',
      labelTextColor: '#22232a', loopTextColor: '#22232a', noteBkgColor: '#f5ebd6', noteTextColor: '#22232a',
      noteBorderColor: '#8a5a12', activationBkgColor: '#dde8e8', activationBorderColor: '#2d6370',
      sequenceNumberColor: '#ffffff', fontFamily: 'Inter, system-ui, sans-serif',
    },
    dark: {
      background: '#1f1e1b', primaryColor: '#26241f', primaryTextColor: '#ece8e0', primaryBorderColor: '#7d766a',
      lineColor: '#a8a196', textColor: '#ece8e0', edgeLabelBackground: '#1f1e1b',
      clusterBkg: '#171614', clusterBorder: '#36332e', secondaryColor: '#282622', tertiaryColor: '#171614',
      actorBkg: '#1d2e31', actorBorder: '#88b9c3', actorTextColor: '#ece8e0', actorLineColor: '#7d766a',
      signalColor: '#a8a196', signalTextColor: '#ece8e0', labelBoxBkgColor: '#282622', labelBoxBorderColor: '#7d766a',
      labelTextColor: '#ece8e0', loopTextColor: '#ece8e0', noteBkgColor: '#33291a', noteTextColor: '#ece8e0',
      noteBorderColor: '#c9a15a', activationBkgColor: '#1d2e31', activationBorderColor: '#88b9c3',
      sequenceNumberColor: '#0f2024', fontFamily: 'Inter, system-ui, sans-serif',
    },
  };
  /* The class colours inside each diagram are written for the light theme; this maps them for dark. */
  const DARK_MAP = [
    ['color:#ffffff', 'color:#0f2024'], ['fill:#ffffff', 'fill:#1f1e1b'], ['fill:#2d6370', 'fill:#88b9c3'],
    ['stroke:#2d6370', 'stroke:#88b9c3'], ['stroke:#224f5a', 'stroke:#a2cad2'], ['fill:#e7e3d9', 'fill:#2b2822'],
    ['fill:#f1efe8', 'fill:#26241f'], ['fill:#dde8e8', 'fill:#1d2e31'], ['fill:#f5ebd6', 'fill:#33291a'],
    ['fill:#ece9e1', 'fill:#232220'], ['stroke:#85807a', 'stroke:#7d766a'], ['stroke:#8a5a12', 'stroke:#c9a15a'],
    ['color:#22232a', 'color:#ece8e0'], ['color:#5a5b63', 'color:#a8a196'],
  ];
  const forDark = (src) => DARK_MAP.reduce((s, [a, b]) => s.split(a).join(b), src);

  function effective() {
    const set = root.getAttribute('data-theme');
    if (set === 'dark' || set === 'light') return set;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  let drawing = 0;
  // Mermaid sizes every box from the text width at draw time, so the web font must be loaded first,
  // otherwise labels are measured in a narrower fallback font and the real text is cut off.
  const fontsReady = Promise.all([
    document.fonts.load('400 16px Inter'), document.fonts.load('500 16px Inter'), document.fonts.load('600 16px Inter'),
  ]).then(() => document.fonts.ready).catch(() => undefined);

  async function drawAll() {
    await fontsReady;
    const token = ++drawing;
    const theme = effective();
    mermaid.initialize({
      startOnLoad: false, securityLevel: 'strict', theme: 'base', themeVariables: THEMES[theme],
      flowchart: { htmlLabels: true, curve: 'basis', useMaxWidth: true },
      sequence: { useMaxWidth: true, mirrorActors: false },
    });
    const bodies = document.querySelectorAll('.diagram-body');
    window.__diagramErrors = [];
    for (const body of bodies) {
      if (token !== drawing) return;
      const i = Number(body.dataset.i);
      const src = theme === 'dark' ? forDark(sources[i]) : sources[i];
      try {
        const { svg } = await mermaid.render('diagram-' + token + '-' + i, src);
        body.innerHTML = svg;
        const el = body.querySelector('svg');
        const natural = parseInt(el.style.maxWidth, 10);
        // Wide diagrams keep a readable size and scroll sideways instead of shrinking to fit.
        if (natural > 0) { el.dataset.mw = natural; el.style.maxWidth = 'none'; el.style.width = Math.min(natural, 1180) + 'px'; }
      } catch (e) {
        window.__diagramErrors.push({ index: i, message: String(e && e.message || e) });
        body.innerHTML = '<div class="err"><strong>This diagram could not be drawn.</strong><pre>' + escapeHtml(String(e && e.message || e)) + '</pre></div>';
      }
    }
    window.__diagramsDone = true;
  }

  const buttons = document.querySelectorAll('.theme button');
  function setMode(mode, persist) {
    if (mode === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', mode);
    buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    if (persist) { try { localStorage.setItem('arch-theme', mode); } catch (e) { /* storage may be blocked */ } }
    drawAll();
  }
  buttons.forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode, true)));
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!root.getAttribute('data-theme')) drawAll(); });

  /* ---------- Expand and rail highlight ---------- */
  content.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-expand]');
    if (!btn) return;
    const fig = btn.closest('figure');
    const on = fig.classList.toggle('expanded');
    btn.textContent = on ? 'Close' : 'Expand';
    const svg = fig.querySelector('svg');
    if (svg) svg.style.width = on ? svg.dataset.mw + 'px' : Math.min(Number(svg.dataset.mw), 1180) + 'px';
    document.body.style.overflow = on ? 'hidden' : '';
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const open = document.querySelector('figure.expanded');
    if (open) { open.querySelector('[data-expand]').click(); }
  });

  const links = [...rail.querySelectorAll('a')];
  const spy = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      if (en.isIntersecting) links.forEach((l) => l.setAttribute('aria-current', String(l.dataset.doc === en.target.id.slice(4))));
    });
  }, { rootMargin: '-20% 0px -70% 0px' });
  document.querySelectorAll('section.doc').forEach((s) => spy.observe(s));
  links[0].setAttribute('aria-current', 'true');

  let saved = 'auto';
  try { saved = localStorage.getItem('arch-theme') || 'auto'; } catch (e) { /* ignore */ }
  setMode(['auto', 'light', 'dark'].includes(saved) ? saved : 'auto', false);
  if (location.hash.length > 1) setTimeout(() => { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }, 50);
</script>
