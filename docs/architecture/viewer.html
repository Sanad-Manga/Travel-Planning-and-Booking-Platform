<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platform Architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout concept: a quiet reading page. Left rail of documents, one calm column of text, diagrams on
     their own light-bordered panels. Colours are the platform theme tokens (docs: frontend/docs/theme.md). */
  :root {
    --bg: #f5f3ee; --surface: #fcfbf8; --surface-2: #ece9e1;
    --border: #dfdbd0; --border-strong: #85807a;
    --fg: #22232a; --muted: #5a5b63;
    --accent: #2d6370; --accent-hover: #224f5a; --accent-soft: #dde8e8; --on-accent: #ffffff;
    --good-bg: #e6efe8; --good-fg: #2f6b45;
    --warn-bg: #f5ebd6; --warn-fg: #8a5a12;
    --bad-bg: #f6e4e1; --bad-fg: #a33a32;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    --radius: 5px; --radius-lg: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #171614; --surface: #1f1e1b; --surface-2: #282622;
      --border: #36332e; --border-strong: #7d766a;
      --fg: #ece8e0; --muted: #a8a196;
      --accent: #88b9c3; --accent-hover: #a2cad2; --accent-soft: #1d2e31; --on-accent: #0f2024;
      --good-bg: #1c2a21; --good-fg: #8fcba5;
      --warn-bg: #33291a; --warn-fg: #e0b873;
      --bad-bg: #351f1c; --bad-fg: #e8a39b;
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --bg: #171614; --surface: #1f1e1b; --surface-2: #282622;
    --border: #36332e; --border-strong: #7d766a;
    --fg: #ece8e0; --muted: #a8a196;
    --accent: #88b9c3; --accent-hover: #a2cad2; --accent-soft: #1d2e31; --on-accent: #0f2024;
    --good-bg: #1c2a21; --good-fg: #8fcba5;
    --warn-bg: #33291a; --warn-fg: #e0b873;
    --bad-bg: #351f1c; --bad-fg: #e8a39b;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 7.5rem; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font); font-size: 16px; line-height: 1.6;
    padding-block: 0;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
  a { color: var(--accent); text-underline-offset: 2px; }
  a:hover { color: var(--accent-hover); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  .wrap {
    max-width: 82rem; margin-inline: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* Header */
  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 0.7rem; flex-wrap: wrap; }
  .brand { display: flex; flex-direction: column; min-width: 0; }
  .brand strong { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; }
  .brand span { font-size: 0.8rem; color: var(--muted); }
  .brand code { font-family: var(--mono); font-size: 0.78rem; background: var(--surface-2); padding: 0.05rem 0.35rem; border-radius: 3px; }
  .theme { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; }
  .theme button {
    font: inherit; font-size: 0.8rem; background: transparent; color: var(--fg); border: 0;
    padding: 0.35rem 0.75rem; min-height: 2rem; cursor: pointer;
  }
  .theme button + button { border-left: 1px solid var(--border-strong); }
  .theme button[aria-pressed='true'] { background: var(--accent); color: var(--on-accent); }

  /* Document rail */
  .shell { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; align-items: start; }
  .rail {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 3.6rem); z-index: 10;
    background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; gap: 0.4rem; overflow-x: auto; padding-block: 0.6rem;
  }
  .rail a {
    white-space: nowrap; text-decoration: none; color: var(--muted); font-size: 0.85rem;
    padding: 0.3rem 0.7rem; border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
  }
  .rail a[aria-current='true'] { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  @media (min-width: 62rem) {
    .shell { grid-template-columns: 13.5rem minmax(0, 1fr); column-gap: 3rem; }
    .rail {
      top: calc(env(safe-area-inset-top, 0px) + 5rem); flex-direction: column; overflow: visible;
      border-bottom: 0; padding-block: 2rem; background: transparent; gap: 0.15rem;
    }
    .rail a { border: 0; border-radius: var(--radius); background: transparent; padding: 0.4rem 0.7rem; white-space: normal; }
    .rail a:hover { background: var(--surface-2); }
    .rail a[aria-current='true'] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  }

  /* Reading column */
  main { min-width: 0; padding-block: 1.5rem 5rem; }
  section.doc { padding-block: 0 3.5rem; margin-block-end: 3rem; border-bottom: 1px solid var(--border); min-width: 0; }
  section.doc:last-child { border-bottom: 0; }
  h1, h2, h3 { line-height: 1.25; text-wrap: balance; letter-spacing: -0.01em; }
  h1 { font-size: 1.9rem; font-weight: 600; margin: 0.5rem 0 0.75rem; }
  h2 { font-size: 1.3rem; font-weight: 600; margin: 2.4rem 0 0.6rem; }
  h3 { font-size: 1.05rem; font-weight: 600; margin: 1.8rem 0 0.4rem; }
  p, li { max-width: 72ch; }
  p { margin: 0.7rem 0; }
  ul, ol { padding-left: 1.3rem; }
  li { margin: 0.25rem 0; }
  code { font-family: var(--mono); font-size: 0.86em; background: var(--surface-2); padding: 0.1rem 0.3rem; border-radius: 3px; overflow-wrap: anywhere; }
  pre { background: var(--surface-2); padding: 0.8rem 1rem; border-radius: var(--radius); overflow-x: auto; }
  pre code { background: transparent; padding: 0; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
  blockquote {
    margin: 0.6rem 0 1.2rem; padding: 0.35rem 0.8rem; border-left: 2px solid var(--accent);
    background: var(--surface); color: var(--muted); font-size: 0.86rem; max-width: none;
  }
  blockquote p { margin: 0.2rem 0; max-width: none; }
  .tablewrap { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 0.88rem; line-height: 1.45; }
  th, td { text-align: left; vertical-align: top; padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--border); min-width: 7rem; }
  td p, th p { margin: 0; }
  th { font-weight: 600; background: var(--surface-2); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }

  .sev { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 0.05rem 0.5rem; border-radius: 999px; letter-spacing: 0.02em; vertical-align: middle; }
  .sev-high { background: var(--bad-bg); color: var(--bad-fg); }
  .sev-medium { background: var(--warn-bg); color: var(--warn-fg); }
  .sev-low { background: var(--accent-soft); color: var(--accent); }
  .sev-info { background: var(--surface-2); color: var(--muted); }

  /* Diagrams */
  figure.diagram { margin: 1.2rem 0 1.6rem; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
  figure.diagram .bar { display: flex; justify-content: flex-end; padding: 0.35rem 0.5rem 0; }
  figure.diagram button {
    font: inherit; font-size: 0.78rem; color: var(--muted); background: transparent; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0.2rem 0.6rem; cursor: pointer; min-height: 1.8rem;
  }
  figure.diagram button:hover { color: var(--fg); border-color: var(--border-strong); }
  .diagram-body { overflow-x: auto; padding: 0.5rem 1rem 1rem; text-align: center; min-height: 6rem; }
  .diagram-body svg { max-width: 100%; height: auto; }
  .diagram-body foreignObject { overflow: visible; }
  .diagram-body .nodeLabel, .diagram-body .edgeLabel { overflow: visible; }
  .diagram-body .pending { color: var(--muted); font-size: 0.85rem; padding: 2rem 0; }
  .diagram-body .err { text-align: left; color: var(--bad-fg); font-size: 0.85rem; }
  figure.diagram.expanded {
    position: fixed; inset: 0; z-index: 40; margin: 0; border-radius: 0; overflow: auto;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  figure.diagram.expanded .bar { position: sticky; top: 0; background: var(--surface); padding-block: 0.5rem; }
  figure.diagram.expanded .diagram-body { overflow: visible; }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>

</head>
